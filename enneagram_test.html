<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에니어그램 팀 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1D2A;
    --ink-soft:#262838;
    --parchment:#F5F0E6;
    --parchment-dim:#EAE3D3;
    --muted:#A8A6B8;
    --line:#3A3D52;

    --t1:#6B8F71; /* 개혁가 */
    --t2:#D98A8A; /* 조력가 */
    --t3:#D9A441; /* 성취자 */
    --t4:#8467A8; /* 개인주의자 */
    --t5:#4A7FA5; /* 탐구자 */
    --t6:#3F8F87; /* 충성가 */
    --t7:#E08850; /* 열정가 */
    --t8:#A8433C; /* 도전자 */
    --t9:#6E9B9E; /* 평화주의자 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--parchment);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.28em;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:clamp(28px,5vw,42px);
    line-height:1.25;
    margin:0 0 14px;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.7;
    max-width:56ch;
  }

  .diagram-holder{
    display:flex;
    justify-content:center;
    margin:36px 0 8px;
  }
  #diagram{ width:min(280px,70vw); height:auto; }
  .diagram-caption{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.08em;
    margin-bottom:36px;
  }

  .progress-track{
    height:3px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--t5),var(--t3));
    transition:width .4s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    margin-bottom:32px;
  }

  .section{
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 24px;
    margin-bottom:18px;
  }
  .section-type{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    margin-bottom:14px;
    font-weight:700;
  }
  .q{
    padding:16px 0;
    border-top:1px solid var(--line);
  }
  .q:first-of-type{ border-top:none; padding-top:0; }
  .q-text{
    font-size:15.5px;
    line-height:1.6;
    margin-bottom:12px;
  }
  .scale{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
  }
  .scale label{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    font-size:10.5px;
    color:var(--muted);
    text-align:center;
    line-height:1.3;
  }
  .scale input{
    appearance:none;
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--muted);
    cursor:pointer;
    transition:all .15s ease;
  }
  .scale input:checked{
    background:var(--parchment);
    border-color:var(--parchment);
    box-shadow:0 0 0 3px rgba(245,240,230,0.18);
  }

  .cta-row{
    display:flex;
    justify-content:center;
    margin:36px 0 10px;
  }
  button{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:14px 34px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    background:var(--parchment);
    color:var(--ink);
    transition:transform .15s ease, opacity .15s ease;
  }
  button:disabled{ opacity:0.35; cursor:not-allowed; }
  button:not(:disabled):hover{ transform:translateY(-1px); }
  .ghost-btn{
    background:transparent;
    color:var(--parchment);
    border:1px solid var(--line);
  }
  .missing-note{
    text-align:center;
    font-size:12.5px;
    color:var(--t2);
    margin-top:10px;
    min-height:16px;
  }

  #quiz-view{ display:block; }
  #result-view{ display:none; }

  .result-hero{
    text-align:center;
    padding:30px 20px 10px;
  }
  .result-hero .num{
    font-family:'Noto Serif KR', serif;
    font-weight:900;
    font-size:64px;
    line-height:1;
    margin-bottom:6px;
  }
  .result-hero .name{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:26px;
    margin-bottom:10px;
  }
  .result-hero .desc{
    color:var(--muted);
    font-size:14.5px;
    max-width:52ch;
    margin:0 auto 6px;
    line-height:1.7;
  }
  .wing-note{
    font-size:12.5px;
    color:var(--muted);
    margin-top:14px;
  }

  .bars{
    margin:34px 0;
  }
  .bar-row{
    display:grid;
    grid-template-columns:130px 1fr 44px;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    font-size:13px;
  }
  .bar-row .lbl{ color:var(--parchment); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{
    height:10px;
    background:var(--ink-soft);
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .bar-fill{ height:100%; border-radius:6px; transition:width .6s ease; }
  .bar-pct{ color:var(--muted); text-align:right; }

  .cards{
    display:grid;
    gap:14px;
    margin:30px 0;
  }
  .info-card{
    background:var(--ink-soft);
    border:1px solid var(--line);
    border-left:4px solid var(--parchment);
    border-radius:10px;
    padding:18px 20px;
    font-size:14px;
    line-height:1.7;
    color:var(--muted);
  }
  .info-card b{ color:var(--parchment); }

  .footer-note{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:30px;
    line-height:1.7;
  }

  @media (max-width:480px){
    .section{ padding:20px 16px; }
    .scale label{ font-size:9px; }
    .scale input{ width:19px; height:19px; }
    .bar-row{ grid-template-columns:90px 1fr 38px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="quiz-view">
    <div class="eyebrow">TEAM WORKSHOP · 45 QUESTIONS</div>
    <h1>우리 팀 에니어그램 테스트</h1>
    <p class="sub">아홉 개의 질문 세트에 각각 5문항씩, 총 45문항입니다. 정답은 없으니 최근 6개월간 일할 때의 나에 가깝게 직관적으로 답해주세요. 완료까지 약 7~10분이 걸립니다.</p>

    <div class="diagram-holder">
      <svg id="diagram" viewBox="0 0 400 400"></svg>
    </div>
    <div class="diagram-caption" id="diagram-caption">아래에서 답변을 시작하면 원의 점들이 채워집니다</div>

    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label"><span id="progress-text">0 / 45 응답</span><span>완료 시 자동으로 결과가 계산됩니다</span></div>

    <div id="sections"></div>

    <div class="cta-row"><button id="submit-btn" disabled>결과 보기</button></div>
    <div class="missing-note" id="missing-note"></div>
  </div>

  <div id="result-view">
    <div class="eyebrow" style="text-align:center;">YOUR RESULT</div>
    <div class="result-hero" id="result-hero"></div>

    <div class="diagram-holder"><svg id="diagram-result" viewBox="0 0 400 400"></svg></div>

    <div class="bars" id="bars"></div>

    <div class="cards" id="cards"></div>

    <div class="cta-row"><button class="ghost-btn" id="restart-btn">다시 응답하기</button></div>
    <div class="footer-note">이 테스트는 자기 이해와 팀 대화를 위한 간이 도구이며, 임상적 진단 도구가 아닙니다. 결과를 팀원과 공유하기 전에 서로 동의를 구해주세요.</div>
  </div>

</div>

    "상황을 주도하고 직접 컨트롤하는 것이 편하다.",
    "약하거나 통제당하는 느낌을 받는 것이 싫다.",
    "할 말은 직설적으로 하는 편이고, 눈치 보며 돌려 말하지 않는다.",
    "내 사람이나 팀을 지키기 위해서라면 강하게 맞설 수 있다.",
    "갈등이 생겨도 정면으로 부딪혀 해결하는 것을 선호한다."
  ],
  9:[
    "갈등 상황을 피하고 평화로운 분위기를 유지하고 싶다.",
    "내 의견보다 다른 사람의 의견에 맞추는 경우가 많다.",
    "여러 사람의 입장을 두루 이해하고 공감할 수 있다.",
    "우선순위를 정하고 결단을 내리는 것이 어렵게 느껴질 때가 있다.",
    "큰 스트레스가 없으면 웬만한 일은 그냥 넘어가는 편이다."
  ]
};

const SCALE_LABELS = ["전혀\n아니다","아니다","보통","그렇다","매우\n그렇다"];
const TOTAL_Q = 45;
const answers = {}; // key "t-i" -> value 1-5

// ---------- build question sections ----------
const sectionsEl = document.getElementById('sections');
Object.keys(QUESTIONS).forEach(t=>{
  const section = document.createElement('div');
  section.className = 'section';
  section.innerHTML = `<div class="section-type" style="color:${TYPES[t].color}">SET ${t} / 9</div>`;
  QUESTIONS[t].forEach((qtext, i)=>{
    const qid = `${t}-${i}`;
    const q = document.createElement('div');
    q.className = 'q';
    q.innerHTML = `
      <div class="q-text">${qtext}</div>
      <div class="scale">
        ${[1,2,3,4,5].map(v=>`
          <label>
            <input type="radio" name="q-${qid}" value="${v}" data-qid="${qid}" data-type="${t}">
            <span>${v===1||v===5? SCALE_LABELS[v-1].replace('\n','<br>'):''}</span>
          </label>
        `).join('')}
      </div>`;
    section.appendChild(q);
  });
  sectionsEl.appendChild(section);
});

document.querySelectorAll('input[type=radio]').forEach(inp=>{
  inp.addEventListener('change', onAnswer);
});

function onAnswer(e){
  const qid = e.target.dataset.qid;
  answers[qid] = parseInt(e.target.value);
  updateProgress();
}

function updateProgress(){
  const count = Object.keys(answers).length;
  document.getElementById('progress-fill').style.width = (count/TOTAL_Q*100)+'%';
  document.getElementById('progress-text').textContent = `${count} / ${TOTAL_Q} 응답`;
  document.getElementById('submit-btn').disabled = count < TOTAL_Q;
  document.getElementById('diagram-caption').textContent = count===0
    ? '아래에서 답변을 시작하면 원의 점들이 채워집니다'
    : count < TOTAL_Q ? `${9-completedSets()}개 세트 남음` : '모든 세트 완료 · 결과 보기를 눌러주세요';
  drawDiagram('diagram', litPointsFromSets());
}

function completedSets(){
  let n=0;
  Object.keys(QUESTIONS).forEach(t=>{
    const done = QUESTIONS[t].every((_,i)=> answers[`${t}-${i}`]!==undefined);
    if(done) n++;
  });
  return n;
}
function litPointsFromSets(){
  const lit = [];
  Object.keys(QUESTIONS).forEach(t=>{
    const done = QUESTIONS[t].every((_,i)=> answers[`${t}-${i}`]!==undefined);
    if(done) lit.push(parseInt(t));
  });
  return lit;
}

document.getElementById('submit-btn').addEventListener('click', ()=>{
  if(Object.keys(answers).length < TOTAL_Q){
    document.getElementById('missing-note').textContent = `아직 응답하지 않은 문항이 ${TOTAL_Q-Object.keys(answers).length}개 있어요.`;
    return;
  }
  showResult();
});

document.getElementById('restart-btn').addEventListener('click', ()=>{
  document.querySelectorAll('input[type=radio]:checked').forEach(i=>i.checked=false);
  Object.keys(answers).forEach(k=>delete answers[k]);
  updateProgress();
  document.getElementById('quiz-view').style.display='block';
  document.getElementById('result-view').style.display='none';
  window.scrollTo({top:0, behavior:'smooth'});
});

function computeScores(){
  const scores = {};
  Object.keys(QUESTIONS).forEach(t=>{
    let sum=0;
    QUESTIONS[t].forEach((_,i)=> sum += (answers[`${t}-${i}`]||0));
    scores[t] = sum; // max 25
  });
  return scores;
}

function showResult(){
  const scores = computeScores();
  const ranked = Object.keys(scores).sort((a,b)=>scores[b]-scores[a]);
  const top = ranked[0];
  const second = ranked[1];
  const topType = TYPES[top];

  document.getElementById('result-hero').innerHTML = `
    <div class="num" style="color:${topType.color}">${top}</div>
    <div class="name">${topType.name} <span style="font-weight:400;color:var(--muted);font-size:16px;">· ${topType.sub}</span></div>
    <div class="desc">${topType.desc}</div>
    <div class="wing-note">2위 성향: <b style="color:${TYPES[second].color}">${second}번 ${TYPES[second].name}</b> — 두 성향이 섞여 나타나는 경우가 많습니다.</div>
  `;

  const barsEl = document.getElementById('bars');
  barsEl.innerHTML = '';
  ranked.forEach(t=>{
    const pct = Math.round(scores[t]/25*100);
    const row = document.createElement('div');
    row.className='bar-row';
    row.innerHTML = `
      <div class="lbl">${t}. ${TYPES[t].name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${TYPES[t].color}"></div></div>
      <div class="bar-pct">${pct}%</div>
    `;
    barsEl.appendChild(row);
  });

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = `
    <div class="info-card" style="border-left-color:${topType.color}"><b>팀에서의 강점</b><br>${topType.strength}</div>
    <div class="info-card" style="border-left-color:${topType.color}"><b>함께 일할 때 팁</b><br>${topType.tip}</div>
  `;

  document.getElementById('quiz-view').style.display='none';
  document.getElementById('result-view').style.display='block';
  drawDiagram('diagram-result', [parseInt(top)], parseInt(top));
  window.scrollTo({top:0, behavior:'smooth'});
}

// ---------- enneagram diagram ----------
function drawDiagram(svgId, litPoints, highlightPoint){
  const svg = document.getElementById(svgId);
  const cx=200, cy=200, r=150;
  const order = [9,1,2,3,4,5,6,7,8];
  const pos = {};
  order.forEach((n,idx)=>{
    const angle = (-90 + 40*idx) * Math.PI/180;
    pos[n] = { x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle) };
  });

  const triangle = [9,3,6,9];
  const hexagram = [1,4,2,8,5,7,1];

  function pathFor(seq){
    return seq.map((n,i)=> (i===0?'M':'L') + pos[n].x.toFixed(1) + ',' + pos[n].y.toFixed(1)).join(' ');
  }

  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#3A3D52" stroke-width="1.5"/>`;
  s += `<path d="${pathFor(triangle)}" fill="none" stroke="#3A3D52" stroke-width="1.2" opacity="0.8"/>`;
  s += `<path d="${pathFor(hexagram)}" fill="none" stroke="#3A3D52" stroke-width="1.2" opacity="0.8"/>`;

  order.forEach(n=>{
    const isLit = litPoints.includes(n);
    const isHi = highlightPoint===n;
    const color = TYPES[n].hex;
    const radius = isHi ? 16 : (isLit ? 10 : 6);
    s += `<circle cx="${pos[n].x}" cy="${pos[n].y}" r="${radius}" fill="${isLit?color:'#1B1D2A'}" stroke="${color}" stroke-width="${isLit?0:1.8}" opacity="${isLit?1:0.55}"/>`;
    s += `<text x="${pos[n].x}" y="${pos[n].y+ (isHi?5.5:4)}" text-anchor="middle" font-size="${isHi?16:11}" font-family="Noto Serif KR, serif" font-weight="700" fill="${isLit? '#1B1D2A':'#A8A6B8'}">${n}</text>`;
  });

  svg.innerHTML = s;
}

drawDiagram('diagram', []);
updateProgress();
</script>
</body>
</html>
